</style></head><body><main><header><i>🧪</i><div><h1>Jar Test</h1><small>자테스트 기록 · 최근 2회 보관</small></div></header>
<section id="home" class="page active"><div id="latest"></div><div class="buttons"><button id="new">＋ 새 시험 입력</button><button id="historybtn" class="secondary">이전 기록</button></div><p class="foot">기록은 이 기기의 브라우저에만 저장됩니다. 앱 삭제 또는 브라우저 데이터 삭제 시 없어질 수 있습니다. 공식 업무기록을 대체하지 않는 보조용입니다.</p></section>
<section id="entry" class="page"><form id="form"><div class="card"><div class="stamp"><span>시험 날짜 <strong id="dateview"></strong></span><span>자동 기록</span><input id="date" type="datetime-local" required></div><div class="fields"><div class="field"><label for="agent">응집제</label><select id="agent"><option>PAC 3종</option><option>MidBACS903</option></select></div><div class="field"><label for="raw">원수 탁도 (NTU)</label><input id="raw" type="number" step="any" min="0" inputmode="decimal" required placeholder="직접 입력"></div></div></div><div class="card"><div class="hintbar"><p class="hint">농도 직접 입력 · 주입량(mL) = 농도(ppm) × 0.2</p><button class="smallghost" id="autofill" type="button">연속 입력</button></div><table><thead><tr><th>비커</th><th>농도<br>ppm</th><th>주입량<br>mL</th><th>탁도<br>NTU</th></tr></thead><tbody id="cups"></tbody></table><div id="minimum" class="callout">탁도를 입력하면 최저값을 표시합니다.</div></div><div class="entry-actions"><button type="button" class="secondary" data-page="home">취소</button><button class="full" type="submit">시험 기록 저장</button></div><p id="error" class="error"></p></form></section>
<section id="history" class="page"><div id="items"></div><p class="foot">최근 2건만 보관합니다. 새로운 기록을 저장하면 가장 오래된 기록을 교체합니다.</p></section>
<section id="detail" class="page"><div class="top"><h2>시험 상세</h2><button class="link" id="back">돌아가기</button></div><div id="detailbox"></div></section>
</main><script>
(()=>{'use strict';const key='jartest_recent2_v1',by=id=>document.getElementById(id);let list=read(),editId=null,detailId=null,returnTo='home';function read(){try{let x=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(x)?x.filter(r=>r&&Array.isArray(r.cups)).slice(0,2):[]}catch{return []}}function store(a){try{localStorage.setItem(key,JSON.stringify(a));list=a;return true}catch{alert('기기에 저장하지 못했습니다. 브라우저 저장 설정을 확인하세요.');return false}}function h(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(x){return String(x||'').slice(0,10).replaceAll('-','.')}function sorted(){return [...list].sort((a,b)=>b.date.localeCompare(a.date))}function doseMl(x){return x===''||!Number.isFinite(+x)?'—':(+x*.2).toFixed(2)}function min(r){let a=r.cups.map((c,i)=>({i,n:Number(c.turb),dose:Number(c.dose)})).filter(v=>r.cups[v.i].turb!==''&&r.cups[v.i].dose!==''&&Number.isFinite(v.n)&&v.n>=0&&Number.isFinite(v.dose)&&v.dose>=0);return a.length?a.reduce((p,c)=>c.n<p.n||(c.n===p.n&&(c.dose<p.dose||(c.dose===p.dose&&c.i<p.i)))?c:p):null}function chosen(r){let m=min(r);return m?h(r.cups[m.i].dose)+' ppm':'미선정'}function cupTable(r){let m=min(r);return `<table><thead><tr><th>비커</th><th>농도<br>ppm</th><th>주입량<br>mL</th><th>탁도<br>NTU</th></tr></thead><tbody>${r.cups.map((c,i)=>`<tr${m&&m.i===i?' class="best"':''}><td>${i+1}${m&&m.i===i?' ✓':''}</td><td>${h(c.dose||'—')}</td><td class="ml">${doseMl(c.dose)}</td><td>${h(c.turb||'—')}</td></tr>`).join('')}</tbody></table><div class="callout">${m?'선정: '+(m.i+1)+'번 비커 · '+h(r.cups[m.i].dose)+' ppm · '+h(r.cups[m.i].turb)+' NTU':'탁도 결과 미입력'}</div>`}function renderPage(name){if(!document.getElementById(name)?.classList.contains('page'))name='home';document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===name));if(name==='home')home();if(name==='history')renderHistory();window.scrollTo(0,0)}
// 실제 브라우저 방문 기록에 앱 내부 화면을 추가한다. Android 뒤로가기는 popstate로 처리된다.
function page(name){if(name==='home'&&(window.history.state?.jarDepth||0)>0){backToHome();return}if(document.querySelector('.page.active')?.id!==name){const depth=(window.history.state?.jarDepth||0)+1;window.history.pushState({jarPage:name,jarDepth:depth},'',location.href)}renderPage(name)}
function backToHome(){const depth=window.history.state?.jarDepth||0;if(depth>0)window.history.go(-depth);else renderPage('home')}
window.addEventListener('popstate',e=>renderPage(e.state?.jarPage||'home'));
// 새로 열거나 새로고침해도 시작 화면은 홈으로 처리한다.
if(!window.history.state?.jarPage)window.history.replaceState({jarPage:'home',jarDepth:0},'',location.href);

function recordCard(r,label,withBack=false){return `<div class="card"><div class="top"><h2>${label}</h2><span class="pill">${label==='최근 자테스트'?'최신':'이전'}</span></div><small>${h(fmt(r.date))}</small><h2>${h(r.agent)}</h2><div class="metrics"><div class="metric"><small>원수 탁도</small><strong>${h(r.raw)} NTU</strong></div><div class="metric"><small>선정 주입농도</small><strong>${chosen(r)}</strong></div></div>${cupTable(r)}</div>`}
function home(){let r=sorted()[0];by('latest').innerHTML=r?recordCard(r,'최근 자테스트'):'<div class="card empty"><div style="font-size:34px">🧪</div><h2>저장된 시험이 없습니다</h2><p>자테스트를 기록하면 최신 시험 결과가 여기에 바로 표시됩니다.</p></div>'}
function renderHistory(){let prior=sorted()[1];by('items').innerHTML=(prior?recordCard(prior,'이전 기록'):'<div class="card empty">이전 시험 기록이 없습니다.<br><small>새 시험을 한 번 더 저장하면 이곳에서 확인할 수 있습니다.</small></div>')+'<div class="history-bottom"><button type="button" class="secondary" data-back-home="1">← 돌아가기</button></div>'}
function now(){let d=new Date(),pad=v=>String(v).padStart(2,'0');return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`}function cups(){return [...by('cups').querySelectorAll('tr')].map(t=>({dose:t.querySelector('.d').value.trim(),turb:t.querySelector('.t').value.trim()}))}function rows(data){by('cups').innerHTML=Array.from({length:6},(_,i)=>`<tr><td>${i+1}</td><td><input aria-label="${i+1}번 농도" class="d" tabindex="${i+1}" type="text" inputmode="decimal" autocomplete="off" value="${h(data[i]?.dose??'')}"></td><td class="ml">${doseMl(data[i]?.dose??'')}</td><td><input aria-label="${i+1}번 탁도" class="t" tabindex="${i+7}" type="text" inputmode="decimal" autocomplete="off" value="${h(data[i]?.turb??'')}"></td></tr>`).join('');by('cups').querySelectorAll('input').forEach(x=>{x.addEventListener('input',recalc);x.addEventListener('focus',()=>x.select());x.addEventListener('click',()=>x.select());x.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();let group=x.classList.contains('d')?'d':'t',a=[...by('cups').querySelectorAll('.'+group)],i=a.indexOf(x);if(a[i+1])a[i+1].focus();else if(group==='d')by('cups').querySelector('.t').focus();else x.blur()}})});recalc()}function recalc(){let a=cups();by('cups').querySelectorAll('tr').forEach((tr,i)=>tr.querySelector('.ml').textContent=doseMl(a[i].dose));let m=min({cups:a});by('minimum').textContent=m?'자동 선정: '+(m.i+1)+'번 비커 · '+a[m.i].dose+' ppm · '+a[m.i].turb+' NTU':'탁도를 입력하면 자동으로 선정합니다.'}
function editor(id=null){editId=id;let r=list.find(x=>x.id===id),last=sorted()[0];by('date').value=r?.date||now();by('dateview').textContent=fmt(by('date').value);by('agent').value=r?.agent||'PAC 3종';by('raw').value=r?.raw||'';by('error').textContent='';rows(r?.cups||last?.cups.map(c=>({dose:c.dose,turb:''}))||Array.from({length:6},(_,i)=>({dose:String(11+i),turb:''})));page('entry')}
by('form').addEventListener('submit',e=>{e.preventDefault();let c=cups(),raw=by('raw').value,err='';if(c.some(x=>[x.dose,x.turb].some(v=>v!==''&&(!Number.isFinite(+v)||+v<0))))err='숫자는 0 이상이어야 합니다.';else if(c.every(x=>x.dose===''&&x.turb===''))err='비커 결과를 입력하세요.';else if(c.some(x=>(x.dose==='')!==(x.turb==='')))err='각 비커의 농도와 탁도를 함께 입력하세요.';else if(raw===''||+raw<0||!by('date').value)err='시험 날짜와 원수 탁도를 입력하세요.';if(err){by('error').textContent=err;return}let r={id:editId||Date.now().toString(36)+Math.random().toString(36).slice(2),date:by('date').value,agent:by('agent').value,raw,cups:c};let a=list.filter(x=>x.id!==r.id).concat(r).sort((a,b)=>b.date.localeCompare(a.date));if(!editId&&a.length>2&&!confirm('새 기록을 저장하면 가장 오래된 시험 기록이 삭제됩니다. 계속할까요?'))return;if(store(a.slice(0,2)))page('home')});by('new').onclick=()=>editor();by('historybtn').onclick=()=>page('history');document.querySelectorAll('[data-page]').forEach(x=>x.onclick=()=>page(x.dataset.page));by('back').onclick=()=>page(returnTo);by('autofill').onclick=()=>{let first=prompt('1번 비커의 시작 농도(ppm)',cups()[0].dose||'11');if(first===null)return;let step=prompt('비커 간 농도 간격(ppm)','1');if(step===null)return;if(!first.trim()||!step.trim()||![+first,+step].every(x=>Number.isFinite(x)&&x>=0)){alert('0 이상의 숫자를 입력하세요.');return}by('cups').querySelectorAll('.d').forEach((el,i)=>el.value=String(Math.round((+first+i*(+step))*10000)/10000));recalc()};document.addEventListener('click',e=>{if(e.target.closest('[data-back-home]')){backToHome();return}let v=e.target.closest('[data-edit]');if(v)editor(v.dataset.edit);v=e.target.closest('[data-delete]');if(v&&confirm('이 시험 기록을 삭제할까요?')){if(store(list.filter(x=>x.id!==v.dataset.delete)))page(document.querySelector('.page.active').id)}});home();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=18').catch(()=>{}));
})();
</script></body></html>
